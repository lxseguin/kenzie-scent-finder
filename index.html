<title>Kenzie's Scent Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<script defer src="vendor/jspdf.umd.min.js"></script>
<script defer src="fonts/fonts.js"></script>
<script defer src="report-pdf.js"></script>

<style>
/* ============================================================
   TOKENS
   Two colour systems, doing two different jobs:
     --st-*   status (has she answered yet, and how) -> the grid
     --fam-*  scent family (what it smells like)     -> the cards
   ============================================================ */
:root{
  --ground:#F1F0F4;
  --surface:#FCFBFD;
  --surface-2:#F5F4F8;
  --ink:#191621;
  --ink-2:#4C4657;
  --ink-3:#7E7789;
  --line:#E3E0E9;
  --line-strong:#CFCADA;
  --accent:#4A3F8F;
  --accent-ink:#FFFFFF;
  --shadow-s:0 1px 2px rgba(25,22,33,.05);
  --shadow-m:0 1px 2px rgba(25,22,33,.05), 0 10px 28px -16px rgba(25,22,33,.32);
  --shadow-l:0 2px 4px rgba(25,22,33,.05), 0 28px 60px -28px rgba(25,22,33,.38);

  /* status */
  --st-new:#6A5CA6;
  --st-yes:#3E7D5E;
  --st-neutral:#9E7832;
  --st-no:#817A8C;

  /* scent family */
  --fam-gourmand:#A9632E;
  --fam-fruity:#BC334A;
  --fam-floral:#AD4A85;
  --fam-amber:#6B50A0;
  --fam-fresh:#1F7B7D;
  --fam-woody:#64602E;

  --tint:11%;
  --tint-edge:30%;
  --wash:14%;
  --wash-soft:8%;
  --r-s:10px;
  --r-m:16px;
  --r-l:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121018; --surface:#1B1823; --surface-2:#241F2F;
    --ink:#F3F0F8; --ink-2:#BAB2C8; --ink-3:#8A8299;
    --line:#2E2839; --line-strong:#423A54;
    --accent:#AD9FF5; --accent-ink:#17121F;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
    --shadow-l:0 2px 4px rgba(0,0,0,.4), 0 28px 60px -28px rgba(0,0,0,.9);
    --st-new:#A294E8; --st-yes:#6FBE92; --st-neutral:#D4A85C; --st-no:#8A8299;
    --fam-gourmand:#E2A369; --fam-fruity:#F2748A; --fam-floral:#E78DC4;
    --fam-amber:#B197EC; --fam-fresh:#59C2C0; --fam-woody:#BBB463;
    --tint:17%; --tint-edge:34%; --wash:20%; --wash-soft:11%;
  }
}
:root[data-theme="dark"]{
  --ground:#121018; --surface:#1B1823; --surface-2:#241F2F;
  --ink:#F3F0F8; --ink-2:#BAB2C8; --ink-3:#8A8299;
  --line:#2E2839; --line-strong:#423A54;
  --accent:#AD9FF5; --accent-ink:#17121F;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
  --shadow-l:0 2px 4px rgba(0,0,0,.4), 0 28px 60px -28px rgba(0,0,0,.9);
  --st-new:#A294E8; --st-yes:#6FBE92; --st-neutral:#D4A85C; --st-no:#8A8299;
  --fam-gourmand:#E2A369; --fam-fruity:#F2748A; --fam-floral:#E78DC4;
  --fam-amber:#B197EC; --fam-fresh:#59C2C0; --fam-woody:#BBB463;
  --tint:17%; --tint-edge:34%; --wash:20%; --wash-soft:11%;
}

.st-new{--st:var(--st-new)}
.st-yes{--st:var(--st-yes)}
.st-neutral{--st:var(--st-neutral)}
.st-no{--st:var(--st-no)}

.fam-gourmand{--fam:var(--fam-gourmand)}
.fam-fruity{--fam:var(--fam-fruity)}
.fam-floral{--fam:var(--fam-floral)}
.fam-amber{--fam:var(--fam-amber)}
.fam-fresh{--fam:var(--fam-fresh)}
.fam-woody{--fam:var(--fam-woody)}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.serif{font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-weight:400}
.eyebrow{
  font-family:"DM Mono","SF Mono",ui-monospace,Menlo,monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:620px;margin:0 auto;padding:0 18px 56px;min-height:100svh;display:flex;flex-direction:column}

/* ---- sticky header ---- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--ground);
  padding:12px 0 10px;display:none;flex-direction:column;gap:9px;
}
.topbar[data-on="1"]{display:flex}
.topbar::after{
  content:"";position:absolute;left:-18px;right:-18px;bottom:-14px;height:14px;
  background:linear-gradient(var(--ground),transparent);pointer-events:none;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.saved{display:flex;align-items:center;gap:6px;transition:opacity .4s}
.saved-dot{width:6px;height:6px;border-radius:50%;background:var(--st-yes)}

.rail{display:flex;gap:2px;height:7px}
.rail i{flex:1 1 0;border-radius:2px;background:color-mix(in oklab,var(--st) 55%,var(--line));transition:background .3s}
.rail i.pending{background:var(--line)}

.counts{display:flex;gap:14px;flex-wrap:wrap}
.count{display:inline-flex;align-items:center;gap:6px;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.count i{width:8px;height:8px;border-radius:50%;background:var(--st)}
.count b{color:var(--ink-2);font-weight:400}

/* ============================================================
   SCREENS
   ============================================================ */
.screen{display:flex;flex:1;flex-direction:column;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---- welcome ---- */
.hero{padding:34px 0 2px;display:flex;flex-direction:column;gap:14px}
.hero-vials{display:flex;gap:5px;height:56px;align-items:flex-end}
.vial{
  flex:1 1 0;border-radius:3px 3px 5px 5px;opacity:.9;transform-origin:bottom;
  background:linear-gradient(var(--fam),color-mix(in oklab,var(--fam) 55%,var(--surface)));
  animation:pour .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes pour{from{transform:scaleY(.06);opacity:0}to{transform:scaleY(1);opacity:.9}}
.hero h1{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(36px,9.5vw,56px);line-height:1.0}
.hero h1 em{font-style:italic;color:var(--accent)}
.lede{font-size:17px;color:var(--ink-2);max-width:46ch}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:24px 22px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:16px;
}
.panel h3{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.panel p{color:var(--ink-2);font-size:15px}

.tips{display:flex;flex-direction:column;gap:13px;counter-reset:tip}
.tip{display:flex;gap:13px;align-items:flex-start}
.tip-n{
  counter-increment:tip;flex:0 0 22px;height:22px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;
  margin-top:2px;font-family:"DM Mono",monospace;font-size:11px;color:var(--ink-2);
}
.tip-n::before{content:counter(tip)}
.tip p{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.tip b{color:var(--ink);font-weight:600}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:14.5px;color:var(--ink-2)}
.field .hint{font-size:13px;color:var(--ink-3)}
input[type="email"],input[type="text"]{
  font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-s);padding:12px 13px;width:100%;
}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[aria-invalid="true"]{border-color:var(--fam-fruity)}
.err{font-size:13.5px;color:var(--fam-fruity);min-height:19px}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:1px solid var(--line-strong);border-radius:var(--r-m);
  padding:15px 22px;font-size:16px;font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--ink);text-align:center;text-decoration:none;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
}
.btn:hover{box-shadow:var(--shadow-m)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-3);font-weight:500;padding:10px 12px;font-size:14px}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2);box-shadow:none}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 170px}

/* ============================================================
   THE GRID
   ============================================================ */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 14px}
.gridhead h2{font-family:"Instrument Serif",Georgia,serif;font-size:30px;line-height:1.05}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

.tile{
  position:relative;text-align:left;cursor:pointer;overflow:hidden;
  border-radius:var(--r-m);padding:13px 13px 12px;
  background:color-mix(in oklab,var(--st) var(--tint),var(--surface));
  border:1px solid color-mix(in oklab,var(--st) var(--tint-edge),transparent);
  display:flex;flex-direction:column;gap:5px;min-height:104px;
  transition:transform .12s ease, box-shadow .2s ease, background .3s ease, border-color .3s ease;
}
.tile:hover{box-shadow:var(--shadow-m);transform:translateY(-1px)}
.tile:active{transform:translateY(0)}
.tile-brand{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.tile-name{font-family:"Instrument Serif",Georgia,serif;font-size:19px;line-height:1.08;color:var(--ink)}
.tile-foot{margin-top:auto;display:flex;align-items:center;gap:6px;padding-top:7px}
.tile-dot{width:8px;height:8px;border-radius:50%;background:var(--st);flex:0 0 auto}
.tile-status{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in oklab,var(--st) 72%,var(--ink-3))}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 2px}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.legend-sw{width:11px;height:11px;border-radius:3px;background:color-mix(in oklab,var(--st) var(--tint),var(--surface));border:1px solid color-mix(in oklab,var(--st) var(--tint-edge),transparent)}

.gridfoot{margin-top:24px;display:flex;flex-direction:column;gap:10px}

/* ============================================================
   SCENT DETAIL
   ============================================================ */
.crumb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}

.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow-m);display:flex;flex-direction:column}
.card-wash{position:absolute;inset:0 0 auto;height:190px;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,color-mix(in oklab,var(--fam) var(--wash),transparent) 0%,transparent 72%)}
.card-body{position:relative;padding:24px 22px 22px;display:flex;flex-direction:column;gap:15px}

.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
  font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fam);background:color-mix(in oklab,var(--fam) var(--wash-soft),var(--surface));
  border:1px solid color-mix(in oklab,var(--fam) 30%,transparent);padding:5px 11px;border-radius:999px}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--fam)}

.card-brand{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.card-name{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(32px,8vw,44px);line-height:1.02;margin-top:-5px}
.card-vibe{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;color:var(--ink-2)}
.card-rule{height:1px;background:var(--line)}

.notes-label{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:13.5px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

.meters{display:flex;flex-direction:column;gap:11px}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.meter span{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.meter-track{height:4px;border-radius:999px;background:var(--line);position:relative}
.meter-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--fam);
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--surface)}

/* price strip */
.price{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 14px;
}
.price-main{font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.price-sub{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.price-link{margin-left:auto;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.price-link:hover{text-decoration:underline}

/* verdict buttons */
.verdicts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.vbtn{
  display:flex;align-items:center;gap:14px;text-align:left;padding:15px 18px;
  border-radius:var(--r-m);cursor:pointer;background:var(--surface);
  border:1.5px solid var(--line-strong);
  transition:transform .12s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.vbtn:hover{box-shadow:var(--shadow-m);border-color:color-mix(in oklab,var(--st) 60%,var(--line-strong))}
.vbtn:active{transform:translateY(1px)}
.vbtn[aria-pressed="true"]{
  background:color-mix(in oklab,var(--st) var(--tint),var(--surface));
  border-color:var(--st);
}
.vbtn-mark{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--st);color:var(--st)}
.vbtn-mark svg{width:16px;height:16px;display:block}
.vbtn-txt{display:flex;flex-direction:column;line-height:1.25}
.vbtn-txt b{font-size:16px;font-weight:600;color:var(--ink)}
.vbtn-txt small{font-size:13px;color:var(--ink-3)}

.jot{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.jot label{font-size:14.5px;color:var(--ink-2);display:flex;align-items:baseline;gap:8px}
.jot label span{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
.jot textarea{
  font:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-m);padding:13px 14px;width:100%;
  min-height:108px;resize:vertical;display:block;
}
.jot textarea::placeholder{color:var(--ink-3)}
.jot textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}

/* ============================================================
   FINALS
   ============================================================ */
.versus{display:flex;flex-direction:column;gap:12px}
.vs-card{position:relative;overflow:hidden;cursor:pointer;text-align:left;width:100%;display:block;padding:0;
  background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r-l);
  transition:transform .12s ease, border-color .2s ease, box-shadow .2s ease}
.vs-card:hover{box-shadow:var(--shadow-m);border-color:color-mix(in oklab,var(--fam) 55%,var(--line-strong))}
.vs-card:active{transform:translateY(1px)}
.vs-inner{position:relative;padding:20px;display:flex;flex-direction:column;gap:9px}
.vs-name{font-family:"Instrument Serif",Georgia,serif;font-size:29px;line-height:1.03}
.vs-vibe{font-size:14px;color:var(--ink-2);line-height:1.45}
.vs-or{display:flex;align-items:center;gap:14px;color:var(--ink-3);
  font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.vs-or::before,.vs-or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============================================================
   REPORT
   ============================================================ */
.sec{margin:34px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-family:"Instrument Serif",Georgia,serif;font-size:28px;line-height:1.1}
.sec .eyebrow{white-space:nowrap}

.group{border-radius:var(--r-l);overflow:hidden;border:1px solid color-mix(in oklab,var(--st) var(--tint-edge),var(--line));
  background:var(--surface)}
.group-head{display:flex;align-items:center;gap:9px;padding:13px 18px;
  background:color-mix(in oklab,var(--st) var(--tint),var(--surface));
  border-bottom:1px solid color-mix(in oklab,var(--st) var(--tint-edge),var(--line))}
.group-head i{width:9px;height:9px;border-radius:50%;background:var(--st)}
.group-head b{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:color-mix(in oklab,var(--st) 70%,var(--ink));font-weight:500}
.group-head span{margin-left:auto;font-family:"DM Mono",monospace;font-size:11px;color:var(--ink-3)}
.group-body{padding:4px 18px}

.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;
  padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-rank{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-3);min-width:16px}
.item-brand{display:block;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.item-name{font-family:"Instrument Serif",Georgia,serif;font-size:20px;line-height:1.15}
.item-meta{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.item-meta a{color:var(--accent);text-decoration:none}
.item-meta a:hover{text-decoration:underline}
.item-note{display:block;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:15px;color:var(--ink-2);margin-top:3px}
.item-price{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

.winner{position:relative;overflow:hidden;border-radius:var(--r-l);background:var(--surface);
  border:1px solid color-mix(in oklab,var(--fam) 40%,var(--line));box-shadow:var(--shadow-l)}
.winner-wash{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 110% at 50% -10%,color-mix(in oklab,var(--fam) 32%,transparent) 0%,transparent 70%)}
.winner-body{position:relative;padding:32px 24px 26px;display:flex;flex-direction:column;gap:13px}
.winner-crown{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fam)}
.winner-name{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(36px,9vw,54px);line-height:.99}

.fambars{display:flex;flex-direction:column;gap:9px}
.fambar{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:11px}
.fambar span{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.fambar-track{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.fambar-fill{height:100%;border-radius:999px;background:var(--fam)}
.fambar b{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-3);font-weight:400;text-align:right}

.banner{background:color-mix(in oklab,var(--st-neutral) 12%,var(--surface));
  border:1px solid color-mix(in oklab,var(--st-neutral) 34%,transparent);
  color:var(--ink-2);border-radius:var(--r-m);padding:12px 15px;font-size:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;z-index:60;
  transition:opacity .25s ease, transform .25s ease;box-shadow:var(--shadow-l);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

.foot{margin-top:30px;text-align:center;color:var(--ink-3);font-size:13px;
  display:flex;flex-direction:column;gap:10px;align-items:center}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* Spread the families out so she never smells two of the same kind
   back to back — seven gourmands in a row is how a nose gets tired.
   Greedy: always take from the largest remaining family that isn't
   the one just placed. Deterministic, so the order never shifts. */
const ORDER = (function(){
  const buckets = {};
  SCENTS.forEach(s => (buckets[s.fam] = buckets[s.fam] || []).push(s.id));
  const keys = Object.keys(FAMILIES).filter(k => buckets[k] && buckets[k].length);
  const out = [];
  let prev = null;
  while(out.length < SCENTS.length){
    const pick = keys
      .filter(k => buckets[k].length && k !== prev)
      .sort((x,y) => buckets[y].length - buckets[x].length || keys.indexOf(x) - keys.indexOf(y))[0]
      // only possible if one family is more than half the list
      || keys.find(k => buckets[k].length);
    out.push(buckets[pick].shift());
    prev = pick;
  }
  return out;
})();

const BY_ID = Object.fromEntries(SCENTS.map(s => [s.id, s]));
const TOTAL = ORDER.length;

/* ==============================================================
   STORAGE
   ============================================================== */
const KEY = "kenzie-scent-finder-v2";
let storageOK = true;
try{ localStorage.setItem(KEY+"-probe","1"); localStorage.removeItem(KEY+"-probe"); }
catch(e){ storageOK = false; }

function blankState(){
  return { screen:"grid", current:null, verdicts:{}, jots:{},
           finals:null, ranking:null };
}
let S = blankState();
try{
  const raw = storageOK ? localStorage.getItem(KEY) : null;
  if(raw){ const l = JSON.parse(raw); if(l && typeof l === "object") S = Object.assign(blankState(), l); }
}catch(e){ /* corrupt save -> start clean rather than break */ }

let saveTimer = null;
function save(){
  if(!storageOK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK = false; return; }
  const tag = document.getElementById("savedTag");
  tag.style.opacity = "1";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ tag.style.opacity = "0"; }, 1400);
}

const main = document.getElementById("main");
const topbar = document.getElementById("topbar");

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 3200);
}
function idsWith(v){ return ORDER.filter(id => S.verdicts[id] === v); }
function ratedCount(){ return ORDER.filter(id => S.verdicts[id]).length; }
function stCls(id){ return S.verdicts[id] ? STATUS[S.verdicts[id]].cls : "st-new"; }
function money(n){ return "$" + n; }
function shopOf(s){ return s.shop || "Ulta"; }

/* yes list, ranked if she ran the head-to-head */
function yesOrdered(){
  const yes = idsWith("yes");
  if(!S.ranking) return yes;
  const ranked = S.ranking.filter(id => S.verdicts[id] === "yes");
  return ranked.concat(yes.filter(id => !ranked.includes(id)));
}

/* ==============================================================
   HEADER
   ============================================================== */
function renderTop(){
  const on = ["scent","report","finals"].includes(S.screen);
  topbar.dataset.on = on ? "1" : "0";
  if(!on) return;
  document.getElementById("rail").innerHTML = ORDER.map(id => {
    const v = S.verdicts[id];
    return '<i class="' + stCls(id) + (v ? "" : " pending") + '"></i>';
  }).join("");
  document.getElementById("progressLabel").textContent =
    ratedCount() + " of " + TOTAL + " reviewed";
}

      ${storageOK ? "" : '<div class="banner" style="margin-top:14px">Heads up: this browser isn\'t letting the page save your progress, so try to finish in one sitting.</div>'}

      ${started ? `<div class="foot"><button class="btn btn-ghost" id="restart">Start over from scratch</button></div>` : ""}
    </section>`;

  main.querySelectorAll(".tile").forEach(t=>{
    t.addEventListener("click", ()=>{ S.current = t.dataset.id; S.screen = "scent"; save(); render(); });
  });
  document.getElementById("toReport").addEventListener("click", ()=>{
    S.screen = "report"; save(); render();
  });
  const rs = document.getElementById("restart");
  if(rs) rs.addEventListener("click", ()=>{
    S = blankState(); save(); render();
  });
}

/* ==============================================================

  no:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const VERDICT_COPY = {

      // A changed answer can invalidate an existing ranking.

/* ==============================================================
   FINALS — binary insertion sort over the "yes" pile.
   Plain data only, so it survives a reload mid-round.
   ============================================================== */
function estimateComparisons(n){
  let t = 0; for(let i=1;i<n;i++) t += Math.ceil(Math.log2(i+1));
  return Math.max(t,1);
}
function startFinals(){
  const pool = idsWith("yes");
  if(pool.length < 2){ S.ranking = pool.slice(); S.finals = null; S.screen = "report"; return; }
  S.finals = { sorted:[pool[0]], queue:pool.slice(1), current:null, lo:0, hi:0,
               done:0, estimate:estimateComparisons(pool.length) };
  S.screen = "finals";
  advanceFinals();
}
function advanceFinals(){
  const f = S.finals;
  if(!f) return false;
  for(;;){
    if(f.current === null){
      if(f.queue.length === 0){ finishFinals(f.sorted.slice()); return false; }
      f.current = f.queue.shift(); f.lo = 0; f.hi = f.sorted.length;
    }
    if(f.lo >= f.hi){ f.sorted.splice(f.lo,0,f.current); f.current = null; continue; }
    return true;
  }
}
function finishFinals(ranking){
  S.ranking = ranking; S.finals = null; S.screen = "report";
}

function vsCard(s, side){
  return `<button class="vs-card fam-${s.fam}" data-side="${side}">
    <div class="card-wash"></div>
    <div class="vs-inner">
      <span class="chip"><i class="chip-dot"></i>${esc(FAMILIES[s.fam].label)}</span>
      <div><div class="card-brand">${esc(s.brand)}</div><div class="vs-name">${esc(s.name)}</div></div>
      <p class="vs-vibe">${esc(s.vibe)}</p>
    </div></button>`;
}

function viewFinals(){
  if(!S.finals){ S.screen = "report"; render(); return; }
  if(!advanceFinals()){ save(); render(); return; }
  const f = S.finals;
  const a = BY_ID[f.current];
  const mid = (f.lo + f.hi) >> 1;
  const b = BY_ID[f.sorted[mid]];
  const pct = Math.min(100, Math.round((f.done / f.estimate) * 100));

  main.innerHTML = `
    <section class="screen">
      <div class="gridhead"><h2>Which would you wear tomorrow?</h2></div>
      <div class="rail st-yes" style="margin-bottom:8px" aria-hidden="true">
        <i style="flex:0 0 ${pct}%"></i><i class="pending" style="flex:1"></i>
      </div>
      <p class="eyebrow num" style="margin-bottom:16px">About ${Math.max(0, f.estimate - f.done)} taps to go</p>
      <div class="versus">${vsCard(a,"a")}<div class="vs-or">or</div>${vsCard(b,"b")}</div>
      <div class="pager">
        <button class="btn btn-ghost" id="stop">Stop here, rank what's done</button>
        <span class="eyebrow">Leading: ${esc(BY_ID[f.sorted[0]].name)}</span>
      </div>
    </section>`;

  main.querySelectorAll(".vs-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(el.dataset.side === "a") f.hi = mid; else f.lo = mid + 1;
      f.done++;
      if(!advanceFinals()){ save(); render(); return; }
      save(); render();
    });
  });
  document.getElementById("stop").addEventListener("click", ()=>{
    const rest = f.sorted.slice();
    if(f.current !== null) rest.splice(Math.min(f.lo, rest.length), 0, f.current);
    finishFinals(rest.concat(f.queue));
    save(); render();
  });
}

/* ==============================================================
   PROFILE
   ============================================================== */
function profile(){
  const base = idsWith("yes");
  if(!base.length) return null;
  const counts = {}; let sweet = 0, weight = 0;
  base.forEach(id=>{ const s = BY_ID[id];
    counts[s.fam] = (counts[s.fam]||0) + 1; sweet += s.sweet; weight += s.weight; });
  return { counts, top:Object.entries(counts).sort((a,b)=>b[1]-a[1]), n:base.length,
           sweet:Math.round(sweet/base.length), weight:Math.round(weight/base.length) };
}
function profileSentence(p){
  if(!p) return "";
  const fam = FAMILIES[p.top[0][0]].label;
  const share = Math.round((p.top[0][1]/p.n)*100);
  const sw = p.sweet >= 72 ? "firmly on the dessert end"
           : p.sweet >= 55 ? "sweet, but not syrupy"
           : p.sweet >= 38 ? "in the middle — soft rather than sugary"
           : "on the clean, fresh side";
  const wt = p.weight >= 74 ? "and you want to be noticed"
           : p.weight >= 55 ? "with a comfortable amount of presence"
           : "and you like it to stay close to you";
  return share >= 45
    ? `You're a <b>${fam}</b> person — ${share}% of your yeses landed there. Your taste sits ${sw}, ${wt}.`
    : `Your taste is broad — no single family ran away with it, though <b>${fam}</b> edged ahead. Overall you sit ${sw}, ${wt}.`;
}

/* ==============================================================

   ============================================================== */

      </div>` : ""}

      ${yes.length ? `
      <div class="sec"><h2>Before you buy</h2><span class="eyebrow">Last step</span></div>
      <div class="panel">

        <div class="tips">
          <div class="tip"><i class="tip-n"></i><p>Spray <b>${esc(BY_ID[yes[0]].name)}</b> on one wrist and <b>${yes[1] ? esc(BY_ID[yes[1]].name) : "your runner-up"}</b> on the other. Don't rub them together — it crushes the top notes.</p></div>
          <div class="tip"><i class="tip-n"></i><p>Walk away for <b>thirty minutes</b>. The one you keep lifting your wrist to smell is the one to buy.</p></div>
          <div class="tip"><i class="tip-n"></i><p>Start with the <b>small bottle</b> — most of these are around $30. You don't have to commit to a full size on day one.</p></div>

      <div class="sec"><h2>Save your report</h2><span class="eyebrow">You're done</span></div>
      <div class="panel">
        ${none.length ? `<div class="banner">You still have <b>${none.length}</b> left to smell. You can save now and save again later — it'll just be missing those.</div>` : ""}

/* ==============================================================
   THE PDF
   Everything the report needs, flattened into plain data for
   report-pdf.js. Layout and styling live over there.
   ============================================================== */
function reportPayload(){
  const yes = yesOrdered(), neutral = idsWith("neutral"), no = idsWith("no");
  const none = ORDER.filter(id => !S.verdicts[id]);
  const ranked = !!S.ranking && yes.length > 1;
  const p = profile();
  const pick = id => {
    const s = BY_ID[id];
    return { brand:s.brand, name:s.name, fam:s.fam, famLabel:FAMILIES[s.fam].label,
             notes:s.notes, vibe:s.vibe, small:s.small, smallSize:s.smallSize,
             full:s.full, fullSize:s.fullSize, url:s.url, shop:shopOf(s),
             note:S.jots[id] || "" };
  };
  return {
    date: new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}),
    total: TOTAL,
    winner: ranked ? pick(yes[0]) : null,
    counts: { yes:yes.length, neutral:neutral.length, no:no.length, none:none.length },
    groups: [
      { key:"yes",     label:"Yes",     sub:"Worth your money",              items:yes.map(pick),     ranked:ranked },
      { key:"neutral", label:"Neutral", sub:"Liked these, didn't love them", items:neutral.map(pick), ranked:false },
      { key:"no",      label:"No",      sub:"Don't buy these",               items:no.map(pick),      ranked:false },
      { key:"none",    label:"Not reviewed yet", sub:"Still to smell",       items:none.map(pick),    ranked:false }
    ],
    profile: p ? {
      sentence: profileSentence(p).replace(/<\/?b>/g,""),
      n:p.n, sweet:p.sweet, weight:p.weight,
      families: p.top.map(([k,c]) => ({ key:k, label:FAMILIES[k].label, n:c }))
    } : null,
    steps: yes.length ? [
      "Spray " + BY_ID[yes[0]].name + " on one wrist and " +
        (yes[1] ? BY_ID[yes[1]].name : "your runner-up") +
        " on the other. Don't rub them together — it crushes the top notes.",
      "Walk away for thirty minutes. The one you keep lifting your wrist to smell is the one to buy.",
      "Start with the small bottle. You don't have to commit to a full size on day one."
    ] : []
  };
}

function wireDownload(){
  const btn = document.getElementById("dl");
  const hint = document.getElementById("dlHint");
  if(!btn) return;

  const onClick = async ()=>{
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "Building your report…";
    try{
      const how = await window.saveReportPDF(reportPayload());
      if(how === "shared")          toast("Sent to your share sheet.");
      else if(how === "cancelled")  toast("No problem — nothing was saved.");
      else                          toast("Saved to your downloads.");
      btn.textContent = how === "downloaded" ? "Saved ✓" : old;
    }catch(err){
      btn.textContent = old;
      toast("Couldn't build the PDF. Refresh and try again.");
      console.error(err);
    }finally{
      btn.disabled = false;
    }
  };

  /* The PDF tools load deferred, so they may land after this screen draws. */
  const ready = () => typeof window.saveReportPDF === "function";
  if(ready()){ btn.addEventListener("click", onClick); return; }

  const idle = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Getting ready…";
  let tries = 0;
  const poll = setInterval(()=>{
    if(ready()){
      clearInterval(poll);
      btn.disabled = false; btn.textContent = idle;
      btn.addEventListener("click", onClick);
    }else if(++tries > 100){
      clearInterval(poll);
      btn.textContent = "Report unavailable";
      if(hint) hint.textContent = "The PDF tools didn't load — check your connection and refresh.";
    }
  }, 100);
}

/* ==============================================================
   ROUTER
   ============================================================== */
function render(){
  renderTop();
  switch(S.screen){
    case "grid":   viewGrid(); break;
    case "scent":  viewScent(); break;
    case "finals": viewFinals(); break;
    case "report": viewReport(); break;
    default:       viewGrid();
  }
  if(S.screen !== "finals") window.scrollTo({top:0,behavior:"instant"});
}

/* Repair a stale save that points at a screen whose data is gone. */
if(S.screen === "scent" && !BY_ID[S.current]) S.screen = "grid";
if(S.screen === "finals" && !S.finals) S.screen = S.ranking ? "report" : "grid";
if(!["grid","scent","finals","report"].includes(S.screen)) S.screen = "grid";

render();
</script>
